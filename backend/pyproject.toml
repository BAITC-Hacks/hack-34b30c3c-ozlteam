[project]
name = "hackalem-backend"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.141.1",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "sqlalchemy[asyncio]==2.0.52",
  "alembic==1.19.2",
  "asyncpg==0.31.0",
  "pgvector==0.5.0",
  "uvicorn[standard]==0.52.4",
  "pyjwt==2.14.0",
  "argon2-cffi==25.1.0",
  "email-validator==2.3.0",
  # безопасность и наблюдаемость
  "slowapi==0.1.10",
  "structlog==26.1.0",
  # загрузка файлов и разбор документов
  "python-multipart==0.0.32",
  "aiofiles==25.1.0",
  "Pillow==12.3.0",
  "pypdfium2==5.13.0",
  "pypdf==6.18.1",
  "python-docx==1.2.0",
  "openpyxl==3.1.5",
  # фоновые задачи и стрим статуса
  "arq==0.28.0",
  # arq требует redis<6, поэтому ветка 5.x, а не последняя 8.x
  "redis[hiredis]==5.3.1",
  "sse-starlette==3.4.11",
  # провайдеры моделей
  "openai==3.13.0",
  "anthropic==1.5.0",
  "httpx==0.28.1",
]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.16.7"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

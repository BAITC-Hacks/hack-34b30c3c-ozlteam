[project]
name = "hackalem-bot"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = ["aiogram==3.31.0", "pydantic-settings==2.15.0", "httpx==0.28.1", "watchfiles==1.2.0"]

[dependency-groups]
dev = ["ruff==0.16.7"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

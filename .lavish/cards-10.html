<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Карточка — десять UI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Manrope:wght@500;600;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:#f4f4f6;color:#14151a;font:14px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit}
.head{max-width:1400px;margin:0 auto;padding:32px 28px 4px}
.head h1{margin:0;font-size:21px;font-weight:600;letter-spacing:-.4px}
.head p{margin:7px 0 0;color:#6b6f76;max-width:74ch;font-size:13.5px}
.grid{max-width:1400px;margin:0 auto;padding:22px 28px 80px;display:grid;gap:30px 24px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));align-items:start}
.item{display:grid;gap:9px}
.lbl{font-size:12.5px;color:#6b6f76;line-height:1.45;padding:0 2px}
.lbl b{color:#14151a;font-weight:600}
.num{font-variant-numeric:tabular-nums}
@media(prefers-reduced-motion:reduce){*{transition-duration:1ms!important}}

.av{width:24px;height:24px;border-radius:50%;background:#1b84ff;color:#fff;display:inline-grid;place-items:center;font-size:10px;font-weight:600;flex:none}
.bdg{display:inline-flex;align-items:center;font-size:11px;font-weight:500;padding:2px 8px;border-radius:20px;white-space:nowrap;line-height:16px;background:rgba(246,177,0,.15);color:#8a6100}
.mtr{height:4px;border-radius:2px;background:rgba(20,21,26,.09);overflow:hidden;display:inline-block;width:44px;vertical-align:middle}
.mtr i{display:block;height:100%;border-radius:2px;background:#1b84ff;width:79%}
.sp{width:13px;height:13px;flex:none;color:#1b84ff}
.btn{height:30px;padding:0 12px;border:0;border-radius:6px;background:#1b84ff;color:#fff;font-size:12.5px;font-weight:500;cursor:pointer;white-space:nowrap}
.btn:active{filter:brightness(.93)}
.btn:focus-visible{outline:2px solid #14151a;outline-offset:2px}
.kebab{width:26px;height:26px;border:0;background:transparent;border-radius:6px;color:#9a9ea6;cursor:pointer;display:grid;place-items:center;flex:none}
.kebab:hover{background:rgba(20,21,26,.06);color:#14151a}
.ai{display:flex;align-items:center;gap:7px;font-size:12.5px;color:#14151a;min-width:0}
.ai span{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who{display:flex;align-items:center;gap:7px;font-size:12px;color:#6b6f76}

/* 1 Metronic */
.c1{background:#fff;border:1px solid #e5e6ea;border-radius:10px;box-shadow:0 1px 2px rgba(20,21,26,.04);overflow:hidden;transition:box-shadow .16s}
.c1:hover{box-shadow:0 4px 14px rgba(20,21,26,.07)}
.c1 .hd{display:flex;align-items:center;gap:9px;padding:11px 14px;border-bottom:1px solid #eef0f3}
.c1 .hd h3{margin:0;font-size:13.5px;font-weight:600;flex:1 1 auto;min-width:0;letter-spacing:-.1px}
.c1 .bd{padding:12px 14px;display:grid;gap:9px}
.c1 .sum{font-size:20px;font-weight:600;letter-spacing:-.4px}
.c1 .sum small{font-size:12px;font-weight:400;color:#6b6f76;letter-spacing:0;margin-left:6px}
.c1 .ft{display:flex;align-items:center;gap:8px;padding:9px 14px;border-top:1px solid #eef0f3;background:#fafafb}
.c1 .ft .who{flex:1 1 auto}

/* 2 Apple */
.c2{background:#fff;border-radius:12px;overflow:hidden}
.c2 .row{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 16px;position:relative}
.c2 .row+.row::before{content:"";position:absolute;left:16px;right:0;top:0;height:.5px;background:rgba(60,60,67,.29)}
.c2 .k{font-size:15px;letter-spacing:-.24px;flex:1 1 auto;min-width:0}
.c2 .v{font-size:15px;letter-spacing:-.24px;color:rgba(60,60,67,.6);white-space:nowrap}
.c2 .title .k{font-weight:600;font-size:16px;letter-spacing:-.4px}
.c2 .chev{width:7px;height:12px;color:rgba(60,60,67,.3);flex:none}
.c2 .ai{padding:11px 16px;font-size:14px;letter-spacing:-.15px}
.c2 .sp{color:#007aff}
.c2 .bdg{background:transparent;color:#ff9500;font-size:15px;font-weight:400;padding:0}

/* 3 Контурная */
.c3{background:#fff;border:1px solid #c9ccd3;border-radius:5px;padding:13px 14px;display:grid;gap:9px;font-family:"Golos Text",system-ui,sans-serif}
.c3 .hd{display:flex;align-items:flex-start;gap:9px}
.c3 .hd h3{margin:0;font-size:14px;font-weight:600;flex:1 1 auto;min-width:0;line-height:1.3}
.c3 .sum{font-size:19px;font-weight:600;letter-spacing:-.2px;padding:8px 0;border-top:1px solid #e5e6ea;border-bottom:1px solid #e5e6ea}
.c3 .sum small{font-size:11.5px;color:#6b6f76;font-weight:400;margin-left:6px}
.c3 .bdg{border-radius:3px}
.c3 .btn{border-radius:4px}
.c3 .ft{display:flex;align-items:center;gap:8px}
.c3 .ft .who{flex:1 1 auto}

/* 4 Приподнятая */
.c4{background:#fff;border-radius:16px;padding:18px;display:grid;gap:11px;box-shadow:0 1px 2px rgba(20,21,26,.04),0 10px 30px rgba(20,21,26,.07);transition:transform .18s cubic-bezier(.2,.7,.3,1),box-shadow .18s}
.c4:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(20,21,26,.04),0 16px 40px rgba(20,21,26,.1)}
.c4 .top{display:flex;justify-content:space-between;align-items:flex-start;gap:9px}
.c4 .top h3{margin:0;font-size:14px;font-weight:600;letter-spacing:-.2px;line-height:1.3}
.c4 .sum{font-size:27px;font-weight:600;letter-spacing:-.8px;line-height:1.05}
.c4 .sum small{display:block;font-size:12px;font-weight:400;color:#6b6f76;letter-spacing:0;margin-top:3px}
.c4 .ai{background:#f4f6fa;border-radius:9px;padding:9px 11px}
.c4 .btn{border-radius:9px;height:34px;width:100%}

/* 5 Статус слева */
.c5{background:#fff;border:1px solid #e5e6ea;border-radius:8px;border-left:3px solid #f6b100;padding:12px 14px 12px 13px;display:grid;gap:8px}
.c5 .hd{display:flex;align-items:center;gap:8px}
.c5 .hd h3{margin:0;font-size:13.5px;font-weight:600;flex:1 1 auto;min-width:0;letter-spacing:-.1px}
.c5 .st{font-size:11.5px;color:#8a6100;font-weight:500;white-space:nowrap}
.c5 .line{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:12.5px;color:#6b6f76}
.c5 .line b{color:#14151a;font-size:16px;font-weight:600;letter-spacing:-.2px}
.c5 .ai{padding-top:8px;border-top:1px solid #eef0f3;font-size:12px}

/* 6 Тонированная шапка */
.c6{background:#fff;border:1px solid #e5e6ea;border-radius:10px;overflow:hidden}
.c6 .hd{background:#f1f4f9;padding:10px 14px;display:flex;align-items:center;gap:9px;border-bottom:1px solid #e5e6ea}
.c6 .hd .ic{width:28px;height:28px;border-radius:7px;background:#fff;border:1px solid #dfe4ec;display:grid;place-items:center;color:#1b84ff;flex:none}
.c6 .hd h3{margin:0;font-size:13.5px;font-weight:600;letter-spacing:-.1px;flex:1 1 auto;min-width:0}
.c6 .bd{padding:12px 14px;display:grid;gap:9px}
.c6 .sum{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:#6b6f76}
.c6 .sum b{color:#14151a;font-size:17px;font-weight:600;letter-spacing:-.3px}
.c6 .ai{border-left:2px solid #1b84ff;padding-left:10px}

/* 7 Строка */
.c7{background:#fff;border:1px solid #e5e6ea;border-radius:8px;padding:10px 13px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:11px;align-items:center;transition:background .14s}
.c7:hover{background:#fafafb}
.c7 .ic{width:32px;height:32px;border-radius:8px;background:rgba(27,132,255,.1);color:#1b84ff;display:grid;place-items:center}
.c7 .mid{display:grid;gap:2px;min-width:0}
.c7 h3{margin:0;font-size:13.5px;font-weight:600;letter-spacing:-.1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c7 .ai{font-size:12px;color:#0b5fc4}
.c7 .right{display:grid;justify-items:end;gap:5px}
.c7 .sum{font-size:14px;font-weight:600;letter-spacing:-.2px;white-space:nowrap}

/* 8 Тёмная */
.c8{background:#1e1e2d;color:#e6e8ec;border-radius:12px;padding:15px 16px;display:grid;gap:10px;font-family:Manrope,system-ui,sans-serif}
.c8 .hd{display:flex;align-items:center;gap:9px}
.c8 .hd h3{margin:0;font-size:14px;font-weight:700;letter-spacing:-.2px;flex:1 1 auto;min-width:0}
.c8 .sum{font-size:22px;font-weight:700;letter-spacing:-.5px}
.c8 .sum small{font-size:12px;font-weight:500;color:#8e91a3;letter-spacing:0;margin-left:6px}
.c8 .ai{color:#e6e8ec}
.c8 .sp{color:#5ea2ff}
.c8 .mtr{background:rgba(255,255,255,.1)}.c8 .mtr i{background:#5ea2ff}
.c8 .bdg{background:rgba(246,177,0,.18);color:#ffd166}
.c8 .kebab{color:#8e91a3}.c8 .kebab:hover{background:rgba(255,255,255,.07);color:#fff}
.c8 .ft{display:flex;align-items:center;gap:8px}
.c8 .who{color:#8e91a3;flex:1 1 auto}
.c8 .btn{background:#3d8bfd;border-radius:8px}

/* 9 Разделённая */
.c9{background:#fff;border:1px solid #e5e6ea;border-radius:10px;display:grid;grid-template-columns:minmax(0,1fr) 108px;overflow:hidden}
.c9 .l{padding:13px 14px;display:grid;gap:8px;align-content:start}
.c9 h3{margin:0;font-size:13.5px;font-weight:600;letter-spacing:-.1px;line-height:1.3}
.c9 .sum{font-size:18px;font-weight:600;letter-spacing:-.3px}
.c9 .r{background:#f4f7fc;border-left:1px solid #e5e6ea;padding:12px 11px;display:grid;gap:5px;align-content:center;text-align:center}
.c9 .r .lab{font-size:10.5px;font-weight:600;color:#0b5fc4;letter-spacing:.03em;text-transform:uppercase}
.c9 .r .big{font-size:26px;font-weight:600;letter-spacing:-.7px;line-height:1}
.c9 .r .t{font-size:11px;line-height:14px;color:#4b5563}

/* 10 Канбан */
.c10{background:#fff;border:1px solid #e5e6ea;border-radius:8px;padding:11px 12px;display:grid;gap:8px;box-shadow:0 1px 1px rgba(20,21,26,.04);cursor:grab}
.c10 .tags{display:flex;gap:5px}
.c10 .tag{font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:4px}
.c10 h3{margin:0;font-size:13.5px;font-weight:600;line-height:1.35;letter-spacing:-.1px}
.c10 .ai{background:rgba(27,132,255,.07);border-radius:6px;padding:6px 8px;font-size:12px;color:#0b5fc4}
.c10 .ft{display:flex;align-items:center;gap:8px;font-size:12px;color:#6b6f76}
.c10 .ft b{color:#14151a;font-weight:600;flex:1 1 auto}
.c10 .av{width:22px;height:22px;font-size:9.5px}
</style>
</head>
<body>
<div class="head">
  <h1>Карточка закупки — десять UI</h1>
  <p>Один элемент AI-CRM в десяти исполнениях. Содержимое одинаковое: название, сумма, статус, строка модели. Различается только визуальный язык — граница или тень, радиус, где стоит статус, как показан ИИ.</p>
</div>
<div class="grid" id="grid"></div>

<script>
(function(){
  var T='Бетон B25, 300 м³', S='1 872 000 ₽', D='к 06.10', ST='Ждёт согласования', AI='Модель рекомендует поставщика', C=79, W='СЕ', WN='Сергей Е.';
  var SP='<svg class="sp" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l2.2 5.6L20 9.8l-5.8 2.2L12 18l-2.2-6L4 9.8l5.8-2.2z"/></svg>';
  var KB='<button class="kebab" type="button" aria-label="Действия"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>';
  var CH='<svg class="chev" viewBox="0 0 7 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m1 1 4.5 5L1 11"/></svg>';
  var CU='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 4 7.5v9L12 21l8-4.5v-9z"/><path d="M4 7.5 12 12l8-4.5M12 12v9"/></svg>';
  var MTR='<span class="mtr"><i></i></span>';
  var AIL='<div class="ai">'+SP+'<span>'+AI+'</span><span class="num" style="flex:none;color:#6b6f76;font-size:12px">'+C+'%</span></div>';

  var CARDS=[
    {n:'1 · Metronic',d:'Шапка, тело, подвал. Граница 1 px, лёгкая тень, радиус 10.',
     h:'<div class="c1"><div class="hd"><h3>'+T+'</h3><span class="bdg">'+ST+'</span>'+KB+'</div><div class="bd"><div class="sum num">'+S+'<small>'+D+'</small></div>'+AIL+'</div><div class="ft"><span class="who"><span class="av">'+W+'</span>'+WN+'</span><button class="btn" type="button">Согласовать</button></div></div>'},
    {n:'2 · Apple',d:'Без границ и теней: белая группа на сером, строки с разделителем от отступа, шеврон.',
     h:'<div class="c2"><div class="row title"><span class="k">'+T+'</span>'+CH+'</div><div class="row"><span class="k">Сумма</span><span class="v num">'+S+'</span></div><div class="row"><span class="k">Статус</span><span class="bdg">'+ST+'</span></div><div class="row ai">'+SP+'<span>'+AI+'</span><span class="v num">'+C+'%</span></div></div>'},
    {n:'3 · Контурная',d:'Нулевая тень, чёткий контур, радиус 5, Golos Text. Сумма между линиями.',
     h:'<div class="c3"><div class="hd"><h3>'+T+'</h3><span class="bdg">'+ST+'</span></div><div class="sum num">'+S+'<small>'+D+'</small></div>'+AIL+'<div class="ft"><span class="who"><span class="av">'+W+'</span>'+WN+'</span><button class="btn" type="button">Согласовать</button></div></div>'},
    {n:'4 · Приподнятая',d:'Без границы, мягкая глубокая тень, радиус 16. Сумма — главный факт. По наведению поднимается.',
     h:'<div class="c4"><div class="top"><h3>'+T+'</h3><span class="bdg">'+ST+'</span></div><div class="sum num">'+S+'<small>'+D+'</small></div>'+AIL+'<button class="btn" type="button">Согласовать</button></div>'},
    {n:'5 · Статус слева',d:'Цвет статуса — рейка 3 px, бейджа нет. Компактно для длинных списков.',
     h:'<div class="c5"><div class="hd"><h3>'+T+'</h3><span class="st">'+ST+'</span>'+KB+'</div><div class="line"><b class="num">'+S+'</b><span>'+D+'</span></div>'+AIL+'</div>'},
    {n:'6 · Тонированная шапка',d:'Шапка на светло-синем с иконкой сущности, ИИ — цитатой с левой линией.',
     h:'<div class="c6"><div class="hd"><span class="ic">'+CU+'</span><h3>'+T+'</h3><span class="bdg">'+ST+'</span></div><div class="bd"><div class="sum"><span>'+D+'</span><b class="num">'+S+'</b></div>'+AIL+'</div></div>'},
    {n:'7 · Строка',d:'Одна строка: иконка, название, сумма и статус справа. Между таблицей и карточкой.',
     h:'<div class="c7"><span class="ic">'+CU+'</span><div class="mid"><h3>'+T+'</h3><div class="ai">'+SP+'<span>'+AI+' · '+C+'%</span></div></div><div class="right"><span class="sum num">'+S+'</span><span class="bdg">'+ST+'</span></div></div>'},
    {n:'8 · Тёмная',d:'Графит #1E1E2D, Manrope, радиус 12. Тёмная карточка на светлом — акцентная в потоке.',
     h:'<div class="c8"><div class="hd"><h3>'+T+'</h3><span class="bdg">'+ST+'</span>'+KB+'</div><div class="sum num">'+S+'<small>'+D+'</small></div><div class="ai">'+SP+'<span>'+AI+'</span>'+MTR+'</div><div class="ft"><span class="who"><span class="av">'+W+'</span>'+WN+'</span><button class="btn" type="button">Согласовать</button></div></div>'},
    {n:'9 · Разделённая',d:'Слева данные, справа панель ИИ с уверенностью крупно. У модели своё место.',
     h:'<div class="c9"><div class="l"><h3>'+T+'</h3><div class="sum num">'+S+'</div><span class="bdg" style="justify-self:start">'+ST+'</span></div><div class="r"><span class="lab">Модель</span><span class="big num">'+C+'%</span><span class="t">рекомендует поставщика</span></div></div>'},
    {n:'10 · Канбан',d:'Теги сверху, название, ИИ строкой, подвал с суммой и исполнителем. Для доски.',
     h:'<div class="c10"><div class="tags"><span class="tag" style="background:rgba(27,132,255,.1);color:#0b5fc4">Бетон</span><span class="tag" style="background:rgba(246,177,0,.15);color:#8a6100">'+ST+'</span></div><h3>'+T+'</h3><div class="ai">'+SP+'<span>'+AI+'</span>'+MTR+'</div><div class="ft"><b class="num">'+S+'</b><span>'+D+'</span><span class="av">'+W+'</span></div></div>'}
  ];

  var g=document.getElementById('grid');
  CARDS.forEach(function(c){
    var it=document.createElement('div');it.className='item';
    var t=document.createElement('template');t.innerHTML=c.h.trim();it.appendChild(t.content);
    var l=document.createElement('div');l.className='lbl';
    var b=document.createElement('b');b.textContent=c.n;l.appendChild(b);
    l.appendChild(document.createTextNode(' — '+c.d));it.appendChild(l);g.appendChild(it);
  });
})();
</script>
</body>
</html>

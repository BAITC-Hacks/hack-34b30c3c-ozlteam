name: hackalem

x-python: &python
  init: true
  environment: &database-env
    POSTGRES_HOST: db
    POSTGRES_DB: ${POSTGRES_DB:-hackathon}
    POSTGRES_USER: ${POSTGRES_USER:-hackathon}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hackathon_dev}
    SECURITY_JWT_SECRET: ${SECURITY_JWT_SECRET:-}
    SECURITY_TOKEN_TTL_SECONDS: ${SECURITY_TOKEN_TTL_SECONDS:-3600}
    REDIS_URL: redis://redis:6379/0
    STORAGE_PATH: /data/uploads
    STORAGE_MAX_UPLOAD_MB: ${STORAGE_MAX_UPLOAD_MB:-25}
    CORS_ORIGINS: ${CORS_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173}
    SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@hackalem.local}
    SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    SEED_MOCK_PASSWORD: ${SEED_MOCK_PASSWORD:-}
    LLM_PROVIDER: ${LLM_PROVIDER:-openai}
    LLM_MODEL: ${LLM_MODEL:-gpt-5}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    NVIDIA_MODEL: ${NVIDIA_MODEL:-}
    NVIDIA_BASE_URL: ${NVIDIA_BASE_URL:-}
    NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
    COMPATIBLE_MODEL: ${COMPATIBLE_MODEL:-}
    COMPATIBLE_BASE_URL: ${COMPATIBLE_BASE_URL:-}
    COMPATIBLE_API_KEY: ${COMPATIBLE_API_KEY:-}
    WATCHFILES_FORCE_POLLING: "true"

services:
  db:
    image: pgvector/pgvector:0.8.6-pg18-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hackathon}
      POSTGRES_USER: ${POSTGRES_USER:-hackathon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hackathon_dev}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    <<: *python
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *python
    build: ./backend
    environment:
      <<: *database-env
      ONEC_ALLOWED_ORIGINS: ${ONEC_ALLOWED_ORIGINS:-}
      ONEC_AUTH_EKT: ${ONEC_AUTH_EKT:-}
    ports:
      - "127.0.0.1:${API_PORT:-7575}:8000"
    volumes:
      - ./backend:/app
      - uploads_data:/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  worker:
    <<: *python
    build: ./backend
    command: ["watchfiles", "--filter", "python", "arq app.Domains.Jobs.worker.WorkerSettings", "app"]
    volumes:
      - ./backend:/app
      - uploads_data:/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  frontend:
    init: true
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://api:8000
    command: sh -c "npm ci --no-audit --no-fund && npm run dev"
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy

  bot:
    init: true
    profiles: [bot]
    build: ./bot
    environment:
      BOT_TOKEN: ${BOT_TOKEN:-}
      API_BASE_URL: http://api:8000
      WATCHFILES_FORCE_POLLING: "true"
    command: ["watchfiles", "--filter", "python", "python -m app.main", "app"]
    volumes:
      - ./bot:/app
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  frontend_modules:
  uploads_data:

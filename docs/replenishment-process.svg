<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title description">
  <title id="title">Пополнение склада — товар, данные и решение о закупке</title>
  <desc id="description">Поставщики доставляют товары на склад предприятия, склад пополняет магазины, магазины продают покупателям. Сроки поставки, остатки, товары в пути и продажи собираются в учётной системе. Сервис очищает разовые всплески, оценивает упущенный спрос, учитывает сезонность и рост. Менеджер проверяет рекомендации и утверждает заказ. Передача поставщику выполняется вручную после утверждения.</desc>
  <!-- Standalone diagram: palette from docs/design/tokens.css; no external assets. -->
  <defs>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#14151a" flood-opacity=".06"/></filter>
    <g id="package" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 9 5v8l-9 5-9-5V8l9-5Zm0 10 9-5M12 13 3 8m9 5v8M7.5 5.5l9 5v4"/></g>
    <g id="warehouse" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21V8l9-5 9 5v13H3Zm5 0V11h8v10M8 15h8M8 18h8"/></g>
    <g id="store" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10v11h16V10M3 10l2-7h14l2 7M3 10a3 3 0 0 0 6 0 3 3 0 0 0 6 0 3 3 0 0 0 6 0M9 21v-6h6v6"/></g>
    <g id="users" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="7" r="4"/><path d="M2 21v-2a7 7 0 0 1 14 0v2m1-17a4 4 0 0 1 0 8m3 9v-2a7 7 0 0 0-3-5"/></g>
    <g id="database" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 4 18 4 18 0V5M3 12c0 4 18 4 18 0"/></g>
    <g id="chart" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18M7 15l5-5 4 3 5-7m-5 0h5v5"/></g>
    <g id="approve" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="18" rx="2"/><rect x="9" y="2" width="6" height="4" rx="1"/><path d="m8 14 3 3 5-6"/></g>
    <g id="document" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H5v20h14V7l-5-5Zm0 0v5h5M8 12h8M8 16h8"/></g>
  </defs>
  <rect width="1440" height="900" rx="16" fill="#f7f6f4"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" fill="#14151a">
    <text x="64" y="73" font-size="34" font-weight="600" letter-spacing="-.7">Как пополняется склад</text>
    <text x="64" y="109" font-size="17" fill="#6b6f76">Электрокомплект · от продажи в магазине до нового заказа поставщику</text>
    <g font-size="14" fill="#6b6f76">
      <path d="M1080 65h36m-7-5 7 5-7 5" fill="none" stroke="#24262b" stroke-width="2"/><text x="1130" y="70">Товар</text>
      <path d="M1080 97h36m-7-5 7 5-7 5" fill="none" stroke="#1b84ff" stroke-width="2"/><text x="1130" y="102">Данные и решения</text>
    </g>

    <text x="64" y="167" font-size="19" font-weight="600">Движение товара</text>
    <g fill="#fff" filter="url(#shadow)">
      <rect x="64" y="193" width="272" height="150" rx="16"/><rect x="400" y="193" width="272" height="150" rx="16"/>
      <rect x="736" y="193" width="272" height="150" rx="16"/><rect x="1072" y="193" width="304" height="150" rx="16"/>
    </g>
    <g fill="#24262b"><rect x="86" y="216" width="44" height="44" rx="10"/><rect x="422" y="216" width="44" height="44" rx="10"/><rect x="758" y="216" width="44" height="44" rx="10"/><rect x="1094" y="216" width="44" height="44" rx="10"/></g>
    <g color="#fff"><use href="#package" transform="translate(96 226)"/><use href="#warehouse" transform="translate(432 226)"/><use href="#store" transform="translate(768 226)"/><use href="#users" transform="translate(1104 226)"/></g>
    <g font-size="19" font-weight="600"><text x="145" y="244">Поставщики</text><text x="481" y="244">Предприятие</text><text x="817" y="244">Магазины</text><text x="1153" y="244">Покупатели</text></g>
    <g font-size="15" fill="#6b6f76">
      <text x="86" y="291">Комплектуют и отгружают</text><text x="86" y="315">товар по заказу</text>
      <text x="422" y="291">РЦ и склады: приёмка,</text><text x="422" y="315">хранение, распределение</text>
      <text x="758" y="291">Продают товар и фиксируют</text><text x="758" y="315">движение запасов</text>
      <text x="1094" y="291">Создают регулярный спрос</text><text x="1094" y="315">и разовые крупные заказы</text>
    </g>
    <g stroke="#24262b" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M345 253h46m-9-6 9 6-9 6"/><path d="M681 253h46m-9-6 9 6-9 6"/><path d="M1017 253h46m-9-6 9 6-9 6"/></g>
    <g font-size="12" text-anchor="middle" fill="#6b6f76"><text x="368" y="280">Поставка</text><text x="704" y="280">В магазин</text><text x="1040" y="280">Продажа</text></g>

    <!-- Data from the three operating parties converges in accounting. -->
    <g stroke="#1b84ff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M200 343v81h672v-81M536 343v81M200 424v81m-6-9 6 9 6-9"/></g>
    <g fill="#f7f6f4"><rect x="136" y="373" width="128" height="28" rx="8"/><rect x="438" y="373" width="196" height="28" rx="8"/><rect x="775" y="373" width="194" height="28" rx="8"/></g>
    <g font-size="14" fill="#0b5fc4" text-anchor="middle"><text x="200" y="392">Сроки, партии</text><text x="536" y="392">Остатки, товары в пути</text><text x="872" y="392">Продажи, дни отсутствия</text></g>
    <g fill="#1b84ff"><circle cx="200" cy="424" r="4"/><circle cx="536" cy="424" r="4"/></g>

    <text x="400" y="478" font-size="19" font-weight="600">Данные превращаются в заказ</text>
    <g fill="#fff" filter="url(#shadow)">
      <rect x="64" y="516" width="272" height="214" rx="16"/><rect x="400" y="516" width="272" height="214" rx="16"/>
      <rect x="736" y="516" width="272" height="214" rx="16"/><rect x="1072" y="516" width="304" height="214" rx="16"/>
    </g>
    <g fill="#e8f3ff"><rect x="86" y="539" width="44" height="44" rx="10"/><rect x="422" y="539" width="44" height="44" rx="10"/><rect x="758" y="539" width="44" height="44" rx="10"/><rect x="1094" y="539" width="44" height="44" rx="10"/></g>
    <g color="#0b5fc4"><use href="#database" transform="translate(96 549)"/><use href="#chart" transform="translate(432 549)"/><use href="#approve" transform="translate(768 549)"/><use href="#document" transform="translate(1104 549)"/></g>
    <g font-size="18" font-weight="600"><text x="145" y="566">Учётная система</text><text x="481" y="566">Сервис расчёта</text><text x="817" y="556">Менеджер</text><text x="817" y="579">закупа</text><text x="1153" y="556">Заказ</text><text x="1153" y="579">поставщику</text></g>
    <g font-size="15" fill="#6b6f76">
      <text x="86" y="616">1С / подготовленные файлы</text><text x="86" y="643">Товары, категории, клиенты*</text><text x="86" y="670">Продажи, запасы и поставки</text><text x="86" y="707" font-size="13">* Обезличенные ID клиентов</text>
      <text x="422" y="616">Убирает разовые всплески</text><text x="422" y="643">Оценивает упущенный спрос</text><text x="422" y="670">Учитывает сезонность и рост</text><text x="422" y="707" fill="#0b5fc4" font-size="13">Количество + причина + срочность</text>
      <text x="758" y="616">Проверяет обоснование</text><text x="758" y="643">Корректирует количество</text><text x="758" y="670">Утверждает закупку</text><text x="758" y="707" fill="#0b5fc4" font-size="13">Решение остаётся за человеком</text>
      <text x="1094" y="616">Позиции сгруппированы</text><text x="1094" y="643">по поставщику и складу</text><text x="1094" y="670">Экспорт / пакет обмена 1С</text><text x="1094" y="707" font-size="13">Передача поставщику вручную</text>
    </g>
    <g stroke="#1b84ff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M345 620h46m-9-6 9 6-9 6"/><path d="M681 620h46m-9-6 9 6-9 6"/><path d="M1017 620h46m-9-6 9 6-9 6"/></g>

    <!-- The supplier loop is a human action, distinct from data processing. -->
    <path d="M1224 730v42q0 16-16 16H40q-16 0-16-16V284q0-16 16-16h15" fill="none" stroke="#1b84ff" stroke-width="1.8" stroke-dasharray="6 6"/>
    <path d="m46 262 9 6-9 6" fill="none" stroke="#1b84ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="418" y="769" width="595" height="36" rx="10" fill="#f7f6f4"/>
    <text x="715" y="793" text-anchor="middle" font-size="15" fill="#0b5fc4">Новый цикл поставки — после подтверждения менеджера</text>

    <text x="64" y="847" font-size="16" font-weight="600">Логика потребности</text>
    <text x="267" y="847" font-size="16" fill="#6b6f76">Целевой запас − текущий остаток − ожидаемые поставки → заказ с учётом партии</text>
    <text x="64" y="876" font-size="13" fill="#6b6f76">Общая бизнес-схема. Статус подключений и различия демонстрационного интерфейса и backend описаны в документации.</text>
  </g>
</svg>
